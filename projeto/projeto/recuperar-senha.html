
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Salão Fácil - Recuperar Senha</title>

    <style>
        /* CONFIGURAÇÕES GERAIS */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #111111;
            color: #F6F1ED;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        /* CARD PRINCIPAL */

        .login-container {
            width: 100%;
            max-width: 430px;
            min-height: 560px;

            background-color: #151515;
            border: 1px solid #333333;
            border-radius: 8px;

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);

            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* LOGO */

        .logo-area {
            text-align: center;
            padding: 30px 20px 22px;
            border-bottom: 1px solid #292929;
        }

        .logo-icon {
            width: 38px;
            height: 38px;

            border: 1px solid #D9A6A0;
            border-radius: 50%;

            margin: 0 auto 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #D9A6A0;
            font-size: 17px;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 27px;
            color: #F6F1ED;
            font-weight: bold;
        }

        .slogan {
            margin-top: 6px;
            color: #99918D;
            font-size: 10px;
        }

        /* CONTEÚDO */

        .form-area {
            padding: 30px;
            flex: 1;

            display: flex;
            flex-direction: column;
        }

        .recovery-icon {
            width: 58px;
            height: 58px;

            border: 1px solid #D9A6A0;
            border-radius: 50%;

            margin: 0 auto 22px;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #D9A6A0;
            font-size: 25px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 30px;
            line-height: 1.2;
            font-weight: normal;

            margin-bottom: 12px;
            text-align: center;

            color: #F6F1ED;
        }

        .description {
            color: #99918D;
            font-size: 13px;
            line-height: 1.6;

            margin-bottom: 28px;
            text-align: center;
        }

        /* CAMPO DE E-MAIL */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #D0CBC8;

            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;

            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 45px;

            background-color: #111111;
            border: 1px solid #333333;
            border-radius: 6px;

            padding: 0 13px;
            color: #F6F1ED;

            outline: none;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;

            transition: 0.3s;
        }

        input::placeholder {
            color: #66605D;
        }

        input:focus {
            border-color: #D9A6A0;
            box-shadow: 0 0 0 2px rgba(217, 166, 160, 0.08);
        }

        /* BOTÃO */

        .login-btn {
            width: 100%;
            min-height: 46px;

            background-color: #D9A6A0;
            border: none;
            border-radius: 30px;

            color: #111111;
            font-weight: bold;
            font-size: 11px;

            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background-color: #F6F1ED;
            box-shadow: 0 0 20px rgba(217, 166, 160, 0.15);
        }

        .login-btn:active {
            transform: scale(0.99);
        }

        /* VOLTAR AO LOGIN */

        .back-link {
            display: block;
            margin-top: 28px;

            text-align: center;
            color: #D9A6A0;
            font-size: 12px;

            text-decoration: none;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #F6F1ED;
        }

        /* MENSAGEM */

        .message {
            display: none;

            margin-top: 15px;
            padding: 12px;

            text-align: center;
            border-radius: 6px;

            font-size: 11px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: rgba(40, 120, 60, 0.15);
            border: 1px solid #3c8b50;
            color: #8cd69a;
        }

        .message.error {
            display: block;
            background: rgba(150, 30, 30, 0.15);
            border: 1px solid #8b3030;
            color: #e58c8c;
        }

        /* TABLET */

        @media (min-width: 481px) and (max-width: 768px) {
            body {
                padding: 25px;
            }

            .login-container {
                max-width: 430px;
            }
        }

        /* CELULAR */

        @media (max-width: 480px) {
            body {
                padding: 0;
                align-items: stretch;
            }

            .login-container {
                width: 100%;
                max-width: none;
                min-height: 100vh;

                border: none;
                border-radius: 0;
                box-shadow: none;
            }

            .logo-area {
                padding-top: 35px;
                padding-bottom: 22px;
            }

            .form-area {
                padding: 35px 22px 25px;
            }

            h1 {
                font-size: 28px;
            }

            .description {
                font-size: 12px;
            }

            input {
                height: 47px;
            }

            .login-btn {
                min-height: 47px;
            }
        }

        /* CELULAR PEQUENO */

        @media (max-width: 360px) {
            .form-area {
                padding: 28px 18px;
            }

            .logo {
                font-size: 24px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <!-- LOGO -->

        <section class="logo-area">

            <div class="logo-icon">✂</div>

            <div class="logo">Salão Fácil</div>

            <div class="slogan">
                Seu horário, do seu jeito.
            </div>

        </section>

        <!-- FORMULÁRIO -->

        <section class="form-area">

            <div class="recovery-icon">✉</div>

            <h1>Recuperar senha</h1>

            <p class="description">
                Informe o e-mail cadastrado na sua conta.
                Enviaremos as instruções para você redefinir
                sua senha.
            </p>

            <form id="recoveryForm">

                <div class="form-group">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>

                <button type="submit" class="login-btn">
                    Enviar instruções
                </button>

                <div
                    id="message"
                    class="message"
                    aria-live="polite"
                ></div>

            </form>

            <a href="index.html" class="back-link">
                ← Voltar para o login
            </a>

        </section>

    </main>

    <script>
        document
            .getElementById("recoveryForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const message = document.getElementById("message");

                message.className = "message";
                message.textContent = "";

                message.textContent =
                    "A tela está pronta, mas a recuperação de senha ainda precisa ser conectada ao sistema.";

                message.className = "message success";
            });
    </script>

</body>
</html>
